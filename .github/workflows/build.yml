name: Compiler AgroDiag CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # jeton GitHub prouvant que c'est bien ce dépôt qui demande la clé de signature

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS: ${{ secrets.AGRODIAG_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Licences Android SDK (déjà installé sur le serveur GitHub)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # Clé privée des APK de test : gardée dans Supabase, remise uniquement à cette compilation (main)
      # sur présentation d'un jeton signé par GitHub. Au tout premier passage, une clé est créée ici.
      - name: Récupérer la clé privée des APK de test
        id: cle
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          PW=$(openssl rand -hex 24)
          keytool -genkeypair -keystore "$RUNNER_TEMP/candidat.jks" -storetype PKCS12 -alias agrodiag -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$PW" -keypass "$PW" -dname "CN=AKA AgroDiag CI, O=YAO Aka Francois, C=CI" > /dev/null 2>&1
          jq -n --arg k "$(base64 -w0 "$RUNNER_TEMP/candidat.jks")" --arg p "$PW" '{keystore:$k,password:$p}' > "$RUNNER_TEMP/candidat.json"
          OIDC=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=agrodiag-cle-signature" | jq -r .value)
          curl -sSf -X POST -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json" --data @"$RUNNER_TEMP/candidat.json" \
            https://uxgwwwdtvrocuqnxuzzn.supabase.co/functions/v1/cle-signature > "$RUNNER_TEMP/cle.json"
          P=$(jq -r .password "$RUNNER_TEMP/cle.json")
          echo "::add-mask::$P"
          jq -r .keystore "$RUNNER_TEMP/cle.json" | base64 -d > "$RUNNER_TEMP/test.jks"
          rm -f "$RUNNER_TEMP/candidat.jks" "$RUNNER_TEMP/candidat.json" "$RUNNER_TEMP/cle.json"
          echo "AGRODIAG_TEST_KEYSTORE_PATH=$RUNNER_TEMP/test.jks" >> "$GITHUB_ENV"
          echo "AGRODIAG_TEST_KEYSTORE_PASSWORD=$P" >> "$GITHUB_ENV"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: APK de test (installable directement sur un téléphone)
        run: gradle --no-daemon assembleDebug

      # Changement de clé officiel d'Android (signature v3, Android 9 et plus) : l'APK porte la preuve que
      # l'ancienne clé de test (publique, retirée du dépôt en 1.8.2) passe la main à la nouvelle clé privée.
      # Les téléphones qui ont l'ancienne version font donc la mise à jour par-dessus, sans perdre leurs données ;
      # ensuite, seule la nouvelle clé est acceptée pour les mises à jour suivantes.
      - name: Transmettre l'ancienne clé de test à la nouvelle
        if: ${{ steps.cle.outputs.ok == 'true' }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          curl -sSfL -o "$RUNNER_TEMP/ancienne.jks" \
            https://raw.githubusercontent.com/${{ github.repository }}/6f4c70bf786dd2801e05449522f3b1deb6ab78f2/app/test-signing.jks
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$BT/apksigner" rotate --out "$RUNNER_TEMP/lignee.bin" \
            --old-signer --ks "$RUNNER_TEMP/ancienne.jks" --ks-key-alias test --ks-pass pass:agrodiagtest --key-pass pass:agrodiagtest \
            --new-signer --ks "$AGRODIAG_TEST_KEYSTORE_PATH" --ks-key-alias agrodiag --ks-pass env:AGRODIAG_TEST_KEYSTORE_PASSWORD --key-pass env:AGRODIAG_TEST_KEYSTORE_PASSWORD
          "$BT/apksigner" sign --lineage "$RUNNER_TEMP/lignee.bin" --rotation-min-sdk-version 28 \
            --ks "$RUNNER_TEMP/ancienne.jks" --ks-key-alias test --ks-pass pass:agrodiagtest --key-pass pass:agrodiagtest \
            --next-signer --ks "$AGRODIAG_TEST_KEYSTORE_PATH" --ks-key-alias agrodiag --ks-pass env:AGRODIAG_TEST_KEYSTORE_PASSWORD --key-pass env:AGRODIAG_TEST_KEYSTORE_PASSWORD \
            "$APK"
          "$BT/apksigner" verify -v --print-certs "$APK" | grep -E "Verified using|Signer|DN:" || true
          rm -f "$RUNNER_TEMP/ancienne.jks" "$RUNNER_TEMP/lignee.bin"

      - name: Préparer la clé de signature
        if: ${{ env.KS != '' }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Bundle signé pour le Play Store (.aab)
        if: ${{ env.KS != '' }}
        env:
          AGRODIAG_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          AGRODIAG_KEYSTORE_PASSWORD: ${{ secrets.AGRODIAG_KEYSTORE_PASSWORD }}
          AGRODIAG_KEY_ALIAS: ${{ secrets.AGRODIAG_KEY_ALIAS }}
          AGRODIAG_KEY_PASSWORD: ${{ secrets.AGRODIAG_KEY_PASSWORD }}
        run: gradle --no-daemon bundleRelease

      # Publié seulement s'il est signé avec la clé privée (sinon n'importe qui pourrait imiter les mises à jour)
      - name: Publier l'APK de test (lien de téléchargement fixe)
        if: ${{ steps.cle.outputs.ok == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AgroDiag-CI-test.apk
          gh release delete test -y --cleanup-tag || true
          gh release create test AgroDiag-CI-test.apk --prerelease --title "AgroDiag CI – version de test" --notes "APK de test à installer directement sur un téléphone Android (build ${{ github.run_number }})."

      - uses: actions/upload-artifact@v4
        with:
          name: AgroDiagCI-apk-de-test
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('app/build/outputs/bundle/release/app-release.aab') != '' }}
        with:
          name: AgroDiagCI-playstore-aab
          path: app/build/outputs/bundle/release/app-release.aab
