name: Compiler AgroDiag CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS: ${{ secrets.AGRODIAG_KEYSTORE_BASE64 }}
      TEST_KS: ${{ secrets.AGRODIAG_TEST_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Licences Android SDK (déjà installé sur le serveur GitHub)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Préparer la clé privée des APK de test
        if: ${{ env.TEST_KS != '' }}
        run: echo "$TEST_KS" | base64 -d > "$RUNNER_TEMP/test.jks"

      - name: APK de test (installable directement sur un téléphone)
        env:
          AGRODIAG_TEST_KEYSTORE_PATH: ${{ env.TEST_KS != '' && format('{0}/test.jks', runner.temp) || '' }}
          AGRODIAG_TEST_KEYSTORE_PASSWORD: ${{ secrets.AGRODIAG_TEST_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleDebug

      - name: Préparer la clé de signature
        if: ${{ env.KS != '' }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Bundle signé pour le Play Store (.aab)
        if: ${{ env.KS != '' }}
        env:
          AGRODIAG_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          AGRODIAG_KEYSTORE_PASSWORD: ${{ secrets.AGRODIAG_KEYSTORE_PASSWORD }}
          AGRODIAG_KEY_ALIAS: ${{ secrets.AGRODIAG_KEY_ALIAS }}
          AGRODIAG_KEY_PASSWORD: ${{ secrets.AGRODIAG_KEY_PASSWORD }}
        run: gradle --no-daemon bundleRelease

      # Publié seulement s'il est signé avec la clé privée (sinon n'importe qui pourrait imiter les mises à jour)
      - name: Publier l'APK de test (lien de téléchargement fixe)
        if: ${{ env.TEST_KS != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AgroDiag-CI-test.apk
          gh release delete test -y --cleanup-tag || true
          gh release create test AgroDiag-CI-test.apk --prerelease --title "AgroDiag CI – version de test" --notes "APK de test à installer directement sur un téléphone Android (build ${{ github.run_number }})."

      - uses: actions/upload-artifact@v4
        with:
          name: AgroDiagCI-apk-de-test
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('app/build/outputs/bundle/release/app-release.aab') != '' }}
        with:
          name: AgroDiagCI-playstore-aab
          path: app/build/outputs/bundle/release/app-release.aab
