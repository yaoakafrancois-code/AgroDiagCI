name: Compiler Lecture CNI

on:
  push:
    branches: [ lecture-cni ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Licences Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compiler l'APK de test
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Publier l'APK (lien de téléchargement fixe)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Lecture-CNI-test.apk
          gh release delete lecture-cni-test -y --cleanup-tag || true
          gh release create lecture-cni-test Lecture-CNI-test.apk --target lecture-cni --prerelease \
            --title "Lecture CNI – version de test" \
            --notes "Application de test pour lire la puce de la CNI ivoirienne (build ${{ github.run_number }})."

      - uses: actions/upload-artifact@v4
        with:
          name: LectureCNI-apk
          path: app/build/outputs/apk/debug/app-debug.apk
