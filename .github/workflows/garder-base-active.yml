name: Garder la base en ligne active

on:
  schedule:
    - cron: '17 6 * * *'   # chaque jour à 6 h 17 (heure d'Abidjan)
  workflow_dispatch:

jobs:
  reveil:
    runs-on: ubuntu-latest
    steps:
      - name: Appel léger à la base Supabase
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              "https://uxgwwwdtvrocuqnxuzzn.supabase.co/rest/v1/rpc/garder_actif" \
              -H "apikey: sb_publishable_J47WwSHCMHxPtIzne5ShhA_HApNZf2t" \
              -H "Content-Type: application/json" -d '{}')
            echo "Réponse : $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "La base ne répond pas : elle est peut-être en pause." && exit 1
