name: Tester sur un téléphone virtuel

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Compiler AgroDiag CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Télécharger l'APK de test publié
        run: curl -sSL -o app.apk https://github.com/${{ github.repository }}/releases/download/test/AgroDiag-CI-test.apk

      # Copie signée seulement avec l'ancienne clé de test, pour vérifier que la mise à jour s'installe par-dessus
      - name: Préparer une « ancienne version » (ancienne clé de test)
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          curl -sSfL -o ancienne.jks https://raw.githubusercontent.com/${{ github.repository }}/6f4c70bf786dd2801e05449522f3b1deb6ab78f2/app/test-signing.jks
          cp app.apk ancienne.apk
          "$BT/apksigner" sign --ks ancienne.jks --ks-key-alias test --ks-pass pass:agrodiagtest --key-pass pass:agrodiagtest ancienne.apk

      - name: Installer, ouvrir et capturer l'écran (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install ancienne.apk
            adb install -r app.apk
            adb logcat -c
            adb shell am start -W -n com.agrodiag.ci/.MainActivity
            sleep 30
            adb exec-out screencap -p > ecran_30s.png
            sleep 30
            adb exec-out screencap -p > ecran.png
            adb shell dumpsys activity activities | grep -iE "mResumedActivity|topResumedActivity" > activite.txt || true
            adb logcat -d -v brief > logcat.txt || true
            grep -iE "agrodiag|AndroidRuntime|chromium|WebView|FATAL" logcat.txt | tail -300 > logcat_filtre.txt || true

      - name: Publier le rapport
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-rapport -R ${{ github.repository }} -y --cleanup-tag || true
          touch ecran.png activite.txt logcat_filtre.txt
          touch ecran_30s.png logcat.txt; gh release create test-rapport ecran.png ecran_30s.png activite.txt logcat_filtre.txt logcat.txt -R ${{ github.repository }} --prerelease --title "Rapport de test sur téléphone virtuel" --notes "Capture d'écran et journal de l'application sur Android 14."
