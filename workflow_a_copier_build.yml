name: Compiler AgroDiag CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS: ${{ secrets.AGRODIAG_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Licences Android SDK (déjà installé sur le serveur GitHub)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: APK de test (installable directement sur un téléphone)
        run: gradle --no-daemon assembleDebug

      - name: Préparer la clé de signature
        if: ${{ env.KS != '' }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Bundle signé pour le Play Store (.aab)
        if: ${{ env.KS != '' }}
        env:
          AGRODIAG_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          AGRODIAG_KEYSTORE_PASSWORD: ${{ secrets.AGRODIAG_KEYSTORE_PASSWORD }}
          AGRODIAG_KEY_ALIAS: ${{ secrets.AGRODIAG_KEY_ALIAS }}
          AGRODIAG_KEY_PASSWORD: ${{ secrets.AGRODIAG_KEY_PASSWORD }}
        run: gradle --no-daemon bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: AgroDiagCI-apk-de-test
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('app/build/outputs/bundle/release/app-release.aab') != '' }}
        with:
          name: AgroDiagCI-playstore-aab
          path: app/build/outputs/bundle/release/app-release.aab
